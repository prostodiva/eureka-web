version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps are what keep the lockfile from drifting into
      # advisories. Batch them into one PR so review stays cheap.
      routine:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend/eureka-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      routine:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
